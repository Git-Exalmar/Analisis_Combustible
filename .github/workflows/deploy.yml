    - name: Update Azure Container Instance
      env:
        DB_USER_INDICADORES: ${{ secrets.DB_USER_INDICADORES }}
        DB_PASS_INDICADORES: ${{ secrets.DB_PASS_INDICADORES }}
        DB_USER_QAS: ${{ secrets.DB_USER_QAS }}
        DB_PASS_QAS: ${{ secrets.DB_PASS_QAS }}
      run: |
        az container create \
          --resource-group "prod-nuevo" \
          --name "contenedor-flota-v6" \
          --image regflotacombustible.azurecr.io/streamlit-app:latest \
          --cpu 1 \
          --memory 1.5 \
          --os-type Linux \
          --vnet "vmdb-prod-vnet" \
          --subnet "subred-docker-flota" \
          --registry-login-server regflotacombustible.azurecr.io \
          --registry-username "${{ secrets.AZURE_REGISTRY_USERNAME }}" \
          --registry-password "${{ secrets.AZURE_REGISTRY_PASSWORD }}" \
          --secure-environment-variables \
            DB_USER_INDICADORES="$DB_USER_INDICADORES" \
            DB_PASS_INDICADORES="$DB_PASS_INDICADORES" \
            DB_USER_QAS="$DB_USER_QAS" \
            DB_PASS_QAS="$DB_PASS_QAS"