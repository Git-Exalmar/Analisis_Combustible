name: Deploy to Azure Container Instances

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: regflotacombustible.azurecr.io
        username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
        password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

    - name: Build and Push Docker Image
      run: |
        docker build -t regflotacombustible.azurecr.io/streamlit-app:latest .
        docker push regflotacombustible.azurecr.io/streamlit-app:latest

    - name: Update Azure Container Instance
      env:
        DB_USER_INDICADORES: ${{ secrets.DB_USER_INDICADORES }}
        DB_PASS_INDICADORES: ${{ secrets.DB_PASS_INDICADORES }}
        DB_USER_QAS: ${{ secrets.DB_USER_QAS }}
        DB_PASS_QAS: ${{ secrets.DB_PASS_QAS }}
      run: |
        az container create \
          --resource-group "prod-nuevo" \
          --name "contenedor-flota-v6" \
          --image regflotacombustible.azurecr.io/streamlit-app:latest \
          --cpu 1 \
          --memory 1.5 \
          --os-type Linux \
          --vnet "vmdb-prod-vnet" \
          --subnet "subred-docker-flota" \
          --registry-login-server regflotacombustible.azurecr.io \
          --registry-username "${{ secrets.AZURE_REGISTRY_USERNAME }}" \
          --registry-password "${{ secrets.AZURE_REGISTRY_PASSWORD }}" \
          --secure-environment-variables \
            DB_USER_INDICADORES="$DB_USER_INDICADORES" \
            DB_PASS_INDICADORES="$DB_PASS_INDICADORES" \
            DB_USER_QAS="$DB_USER_QAS" \
            DB_PASS_QAS="$DB_PASS_QAS"